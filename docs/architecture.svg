<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a2e">NHI Governance — System Architecture</text>

  <!-- Browser -->
  <rect x="60" y="90" width="200" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="125" text-anchor="middle" font-size="15" font-weight="600" fill="#3730a3">Browser</text>
  <text x="160" y="147" text-anchor="middle" font-size="12" fill="#4338ca">React (Vite)</text>
  <text x="160" y="165" text-anchor="middle" font-size="11" fill="#6b7280">Screen 1 + Screen 2</text>

  <!-- Upload files -->
  <rect x="60" y="220" width="200" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="160" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">directory.json</text>
  <text x="160" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">activity.json</text>

  <!-- FastAPI -->
  <rect x="380" y="90" width="220" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#15803d">FastAPI Backend</text>
  <text x="490" y="150" text-anchor="middle" font-size="11" fill="#166534">POST /ingest</text>
  <text x="490" y="170" text-anchor="middle" font-size="11" fill="#166534">GET /identities</text>
  <text x="490" y="190" text-anchor="middle" font-size="11" fill="#166534">GET /identities/{id}</text>
  <text x="490" y="210" text-anchor="middle" font-size="11" fill="#166534">GET /risks</text>

  <!-- Risk Engine -->
  <rect x="380" y="280" width="220" height="90" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="490" y="315" text-anchor="middle" font-size="15" font-weight="600" fill="#9d174d">Risk Engine</text>
  <text x="490" y="337" text-anchor="middle" font-size="11" fill="#9d174d">Orphan · Least Privilege</text>
  <text x="490" y="353" text-anchor="middle" font-size="11" fill="#9d174d">Separation of Duties · Purpose Boundary</text>

  <!-- PostgreSQL -->
  <rect x="720" y="90" width="220" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="830" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">PostgreSQL</text>
  <text x="830" y="150" text-anchor="middle" font-size="12" fill="#1e40af">identities</text>
  <text x="830" y="170" text-anchor="middle" font-size="11" fill="#3b82f6">account_id, type, agent,</text>
  <text x="830" y="185" text-anchor="middle" font-size="11" fill="#3b82f6">purpose, permissions</text>
  <text x="830" y="210" text-anchor="middle" font-size="12" fill="#1e40af">activities</text>

  <!-- .env -->
  <rect x="720" y="280" width="220" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="830" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">.env</text>
  <text x="830" y="330" text-anchor="middle" font-size="11" fill="#6b7280">DB credentials (not in git)</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="260" y1="255" x2="378" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="210" font-size="11" fill="#374151">upload (multipart)</text>

  <line x1="380" y1="145" x2="262" y2="145" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="135" font-size="11" fill="#374151">JSON response</text>

  <line x1="600" y1="150" x2="718" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="718" y1="180" x2="600" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="140" font-size="10" fill="#374151">INSERT</text>
  <text x="610" y="198" font-size="10" fill="#374151">SELECT</text>

  <line x1="490" y1="240" x2="490" y2="278" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="262" font-size="10" fill="#374151">evaluate</text>

  <line x1="830" y1="240" x2="830" y2="278" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="840" y="262" font-size="10" fill="#6b7280">reads at</text>
  <text x="840" y="273" font-size="10" fill="#6b7280">startup</text>

  <!-- Bottom flow labels -->
  <rect x="60" y="430" width="880" height="150" rx="10" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="500" y="460" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Request flow, step by step</text>

  <text x="90" y="495" font-size="13" fill="#374151">1. User uploads directory.json + activity.json in the browser (Screen 1)</text>
  <text x="90" y="520" font-size="13" fill="#374151">2. React sends both files as multipart/form-data to POST /ingest</text>
  <text x="90" y="545" font-size="13" fill="#374151">3. FastAPI validates the JSON, then stores it in PostgreSQL (replacing the previous scan)</text>
  <text x="520" y="495" font-size="13" fill="#374151">4. User selects an identity (Screen 2) → GET /identities/{id}</text>
  <text x="520" y="520" font-size="13" fill="#374151">5. Backend reads current data from PostgreSQL, runs the Risk Engine</text>
  <text x="520" y="545" font-size="13" fill="#374151">6. Returns granted vs used permissions, timeline, and risks with plain-language reasons</text>

  <text x="500" y="605" text-anchor="middle" font-size="11" fill="#9ca3af">No AI agent framework used — this is deterministic rule evaluation, not a task requiring autonomous reasoning.</text>
</svg>